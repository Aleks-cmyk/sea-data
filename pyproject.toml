[project]
name = "sea-data"
version = "0.1.0"
description = "Synthetic maritime images with object and horizon ground truth, rendered in Blender"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Christian Rankl", email = "christian.rankl@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
sea-data = "sea_data:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Modules only available inside Blender's embedded Python.
module = ["bpy", "bpy.*", "bmesh", "bmesh.*", "mathutils", "mathutils.*", "numpy", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["blender: renders with a real Blender installation (slow)"]
